# YAML Linting Configuration for NeuroVision

extends: default

rules:
  line-length:
    max: 120
    level: warning
  
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false
  
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']
  
  comments:
    min-spaces-from-content: 2
  
  document-start: disable
  
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

ignore: |
  .godot/
  addons/
  exports/
  releases/
  node_modules/